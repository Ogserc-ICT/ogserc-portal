# Production on a single VPS: the app, PostgreSQL and Caddy (HTTPS). D-054, RUNBOOK Section 5.
# Values come from .env next to this file on the server (never committed; see .env.example).
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Only Caddy publishes ports (80 and 443). The app and the database are reachable only inside
# this compose network.

name: ogserc

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  app:
    build:
      context: .
      args:
        IMAGE_PROCESSING: ${IMAGE_PROCESSING:-on}
        UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
        # Canonical links, link previews, robots.txt and sitemap.xml are built in advance (D-078).
        SITE_URL: ${SITE_URL:?Set SITE_URL in .env}
    image: ogserc-portal:latest
    restart: unless-stopped
    environment:
      # "off" on OGSERC's VPS until its CPU can run sharp (D-056). Needed at build and run time.
      IMAGE_PROCESSING: ${IMAGE_PROCESSING:-on}
      # Visitor statistics (D-077). Build time for static pages, run time for dynamic ones.
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      DATABASE_URL: postgres://ogserc:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/ogserc
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Set PAYLOAD_SECRET in .env}
      SITE_URL: ${SITE_URL:?Set SITE_URL in .env}
      # Caddy sets this header to the visitor's address and ignores any value the visitor sends,
      # so sign-in limits count each visitor separately (D-081). Required in production.
      CLIENT_IP_HEADER: X-Forwarded-For
      # Uploaded files go to an S3-compatible bucket, never the container's disk, which every
      # deploy replaces (D-086, RUNBOOK Section 6). The server refuses to start without them.
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env}
      S3_REGION: ${S3_REGION:?Set S3_REGION in .env}
      S3_ENDPOINT: ${S3_ENDPOINT:?Set S3_ENDPOINT in .env}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ogserc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ogserc
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ogserc -d ogserc']
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  # Privacy-friendly visitor statistics (FR-WEB-07, D-077). Uses its own database and database
  # user in the same PostgreSQL server (deploy/create-analytics-db.sh), so it cannot read the
  # site's data. Caddy serves its tracker on the site's address and its dashboard on stats.<domain>.
  umami:
    image: ghcr.io/umami-software/umami:3.5.0
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:?Set UMAMI_DB_PASSWORD in .env}@db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?Set UMAMI_APP_SECRET in .env}
      # Required for two-factor sign-in, which every dashboard account must turn on.
      TWO_FACTOR_ENCRYPTION_KEY: ${UMAMI_2FA_KEY:?Set UMAMI_2FA_KEY in .env}
      # Public as /pulse/p.js and /pulse/e: Caddy removes the /pulse prefix (deploy/Caddyfile).
      TRACKER_SCRIPT_NAME: p.js
      COLLECT_API_ENDPOINT: /e
      # Caddy replaces any X-Forwarded-For a visitor sends with their real address.
      CLIENT_IP_HEADER: x-forwarded-for
      DISABLE_TELEMETRY: '1'
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
      # Unset: 192.0.2.1, an address no visitor can have, so /admin and /api stay closed to everyone. Set only for the first-administrator window
      # (RUNBOOK Section 4), then removed again (D-087).
      ADMIN_ALLOW_IP: ${ADMIN_ALLOW_IP:-192.0.2.1}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Visit log, read by deploy/log-report.sh (D-079).
      - caddy_logs:/var/log/caddy
    depends_on:
      - app
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  caddy_logs:
