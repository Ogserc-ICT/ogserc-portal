# Production on a single VPS: the app, PostgreSQL and Caddy (HTTPS). D-054, RUNBOOK Section 5.
# Values come from .env next to this file on the server (never committed; see .env.example).
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Only Caddy publishes ports (80 and 443). The app and the database are reachable only inside
# this compose network.

name: ogserc

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  app:
    build:
      context: .
      args:
        IMAGE_PROCESSING: ${IMAGE_PROCESSING:-on}
        UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
    image: ogserc-portal:latest
    restart: unless-stopped
    environment:
      # "off" on OGSERC's VPS until its CPU can run sharp (D-056). Needed at build and run time.
      IMAGE_PROCESSING: ${IMAGE_PROCESSING:-on}
      # Visitor statistics (D-077). Build time for static pages, run time for dynamic ones.
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      DATABASE_URL: postgres://ogserc:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/ogserc
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Set PAYLOAD_SECRET in .env}
      SITE_URL: ${SITE_URL:?Set SITE_URL in .env}
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ogserc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ogserc
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ogserc -d ogserc']
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  # Privacy-friendly visitor statistics (FR-WEB-07, D-077). Uses its own database and database
  # user in the same PostgreSQL server (deploy/create-analytics-db.sh), so it cannot read the
  # site's data. Caddy serves its tracker on the site's address and its dashboard on stats.<domain>.
  umami:
    image: ghcr.io/umami-software/umami:3.5.0
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:?Set UMAMI_DB_PASSWORD in .env}@db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?Set UMAMI_APP_SECRET in .env}
      # Required for two-factor sign-in, which every dashboard account must turn on.
      TWO_FACTOR_ENCRYPTION_KEY: ${UMAMI_2FA_KEY:?Set UMAMI_2FA_KEY in .env}
      # Neutral paths on the site's own address (see deploy/Caddyfile and Analytics.tsx).
      TRACKER_SCRIPT_NAME: pulse/p.js
      COLLECT_API_ENDPOINT: /pulse/e
      # Caddy replaces any X-Forwarded-For a visitor sends with their real address.
      CLIENT_IP_HEADER: x-forwarded-for
      DISABLE_TELEMETRY: '1'
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
