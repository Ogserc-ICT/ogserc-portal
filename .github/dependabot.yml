# Weekly pull requests for dependency and GitHub Actions updates (NFR-SEC-11).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Payload packages must stay on the same version, so update them together.
      payload:
        patterns: ['payload', '@payloadcms/*']
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: ['payload', '@payloadcms/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
