name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, audit
    runs-on: ubuntu-latest
    env:
      # Placeholders so the Payload config loads; these jobs never touch a database.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      PAYLOAD_SECRET: ci-placeholder-not-a-secret
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Fails only on high or critical vulnerabilities; lower ones are handled by Dependabot.
      - run: pnpm audit --audit-level high

  e2e:
    name: Build and end-to-end tests (Playwright + axe)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ogserc
          POSTGRES_PASSWORD: ogserc
          POSTGRES_DB: ogserc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ogserc -d ogserc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ogserc:ogserc@localhost:5432/ogserc
      SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Generate a throwaway session secret
        run: echo "PAYLOAD_SECRET=$(openssl rand -hex 48)" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Apply database migrations
        run: pnpm migrate
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ogserc-portal:ci
